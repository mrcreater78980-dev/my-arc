name: Publish MY ARC

on:
  push:
    branches: [main]
    paths:
      - 'my_arc/**'
      - '.github/workflows/publish-my-arc.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        working-directory: my_arc
        run: flutter pub get

      - name: Build web app
        working-directory: my_arc
        run: flutter build web --release --base-href /my-arc/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload web build
        uses: actions/upload-pages-artifact@v4
        with:
          path: my_arc/build/web

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
